<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio DevOpss</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 450px;
            border: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .status {
            display: inline-block;
            background-color: #22c55e;
            color: #052e16;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 ¡Laboratorio DevOpssss!</h1>
        <p>Esta aplicación fue empaquetada y desplegada automáticamente con <strong>GitHub Actions</strong>.</p>
        <div class="status">Versión 3.0 - Despliegue Exitoso - Prueba de Github actionss</div>
    </div>
</body>
</html>
